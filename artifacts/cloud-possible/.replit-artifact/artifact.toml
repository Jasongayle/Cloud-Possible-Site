kind = "web"
previewPath = "/"
title = "Cloud Possible Website"
version = "1.0.0"
id = "artifacts/cloud-possible"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25598

[services.development]
run = "pnpm --filter @workspace/cloud-possible run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cloud-possible", "run", "build" ]
publicDir = "artifacts/cloud-possible/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25598"
BASE_PATH = "/"
