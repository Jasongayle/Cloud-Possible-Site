<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary SEO -->
    <title>Cloud Possible | Managed IT Support for Ontario Small Businesses</title>
    <meta name="description" content="Cloud Possible provides managed IT support, cybersecurity, and cloud solutions for small businesses in Ontario. Flat-rate plans starting at $79/device/month. No long-term contracts." />
    <meta name="keywords" content="managed IT services Ontario, IT support small business, cybersecurity Ontario, cloud solutions Brampton, IT support Mississauga, managed services Caledon, helpdesk Ontario, Microsoft 365 migration Ontario" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Cloud Possible" />
    <link rel="canonical" href="https://cloudpossible.ca/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cloudpossible.ca/" />
    <meta property="og:title" content="Cloud Possible | Managed IT Support for Ontario Small Businesses" />
    <meta property="og:description" content="Flat-rate managed IT support, cybersecurity, and cloud solutions for small businesses across Ontario. Starting at $79/device/month. No long-term contracts." />
    <meta property="og:image" content="https://cloudpossible.ca/og-image.png" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:site_name" content="Cloud Possible" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cloud Possible | Managed IT Support for Ontario Small Businesses" />
    <meta name="twitter:description" content="Flat-rate managed IT support, cybersecurity, and cloud solutions for small businesses across Ontario. Starting at $79/device/month." />
    <meta name="twitter:image" content="https://cloudpossible.ca/og-image.png" />

    <!-- Geo tags for local SEO -->
    <meta name="geo.region" content="CA-ON" />
    <meta name="geo.placename" content="Ontario, Canada" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Local Business Schema (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Cloud Possible",
      "alternateName": "Cloud Possible IT Services",
      "description": "Managed IT support, cybersecurity, and cloud solutions for small businesses in Ontario, Canada. Flat-rate monthly plans, no long-term contracts.",
      "url": "https://cloudpossible.ca",
      "email": "info@cloudpossible.ca",
      "logo": "https://cloudpossible.ca/cloud-possible-logo.png",
      "image": "https://cloudpossible.ca/og-image.png",
      "priceRange": "$$",
      "currenciesAccepted": "CAD",
      "paymentAccepted": "Credit Card, Bank Transfer",
      "areaServed": [
        "Brampton", "Mississauga", "Caledon", "Georgetown", "Oakville",
        "Milton", "Kitchener", "Guelph", "Waterloo", "Ontario"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "ON",
        "addressCountry": "CA"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Managed IT Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Managed IT Support",
              "description": "Proactive monitoring and unlimited remote helpdesk for small businesses."
            },
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "79",
              "priceCurrency": "CAD",
              "referenceQuantity": {
                "@type": "QuantitativeValue",
                "value": "1",
                "unitText": "device/month"
              }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Cloud & Backup Solutions",
              "description": "Microsoft 365 migrations, Azure infrastructure, and automated disaster recovery."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Cybersecurity",
              "description": "Endpoint security, dark web monitoring, phishing training, and compliance management."
            }
          }
        ]
      },
      "sameAs": [
        "https://www.linkedin.com/company/cloud-possible"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
